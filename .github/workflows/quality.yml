name: Offline PWA tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline application and protected AI backend
        run: node --test tests/*.test.mjs

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-audit --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real PWA in Chromium, iPhone-like viewport and offline
        run: node --test tests/browser.e2e.mjs
